<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokédex Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;color:#2b2d42;background:radial-gradient(circle at 15% 8%,#fff7 0 10%,transparent 11%),radial-gradient(circle at 88% 30%,#fff5 0 8%,transparent 9%),linear-gradient(160deg,#8fe3ff,#c4b5fd 55%,#ffd1dc) fixed;min-height:100vh}
a{color:inherit;text-decoration:none}input,select,button{font:inherit}
header{background:linear-gradient(#ff6b6b,#e63946);border-bottom:6px solid #2b2d42;padding:14px 14px 18px;text-align:center;color:#fff}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(30px,7vw,52px);font-weight:800;text-shadow:0 4px 0 #0003;line-height:1}
.ball{display:inline-block;width:1em;height:1em;border-radius:50%;border:.1em solid #222;background:linear-gradient(#ff3b3b 45%,#222 45% 55%,#fff 55%);position:relative;flex:none}
.ball:after{content:"";position:absolute;left:50%;top:50%;width:.36em;height:.36em;transform:translate(-50%,-50%);border:.08em solid #222;border-radius:50%;background:#fff}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.bar input{flex:1 1 220px;max-width:420px;border:4px solid #2b2d42;border-radius:99px;padding:6px 18px;font-size:18px;outline:0}
.bar input:focus,.btn:focus-visible,.chip:focus-visible{outline:4px solid #3b82f6}
.btn{display:inline-block;border:4px solid #2b2d42;background:#ffd93d;color:#2b2d42;border-radius:99px;padding:4px 18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #2b2d42;font-size:18px}
.btn:active{transform:translateY(3px);box-shadow:none}select.btn{background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 10px 0;max-width:1000px;margin:auto}
.chip{border:0;border-radius:99px;padding:2px 13px;color:#fff;text-shadow:0 1px 2px #0006;font-weight:700;background:var(--c);cursor:pointer;opacity:.62;text-transform:capitalize;font-size:15px}
.chip.on{opacity:1;outline:3px solid #fff;transform:scale(1.1);box-shadow:0 3px 8px #0004}
.count{text-align:center;font-weight:800;margin:12px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;padding:6px 16px 30px;max-width:1200px;margin:auto}
.card{background:#fff;border-radius:24px;border-bottom:7px solid var(--c);text-align:center;padding:8px 8px 12px;transition:transform .2s;content-visibility:auto;contain-intrinsic-size:200px 190px;box-shadow:0 6px 14px #0002}
.card:hover{transform:translateY(-6px) rotate(-1.5deg) scale(1.04)}
.card img{width:104px;height:104px;object-fit:contain}
.card small{color:#889;font-weight:700;display:block}
.card b{font-size:17px;display:block;line-height:1.1;margin:2px 0 6px}
.itype{display:inline-block;border-radius:99px;padding:0 10px;margin:1px;color:#fff;font-size:13px;font-weight:700;text-transform:capitalize;background:#888;text-shadow:0 1px 2px #0006}
.wrap{max-width:900px;margin:auto;padding:16px}
.hero{background:var(--c);border-radius:36px;border:5px solid #2b2d42;box-shadow:0 8px 0 #2b2d42;padding:22px;margin-top:14px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;color:#fff;background-image:radial-gradient(circle at 85% 15%,#fff4 0 16%,transparent 17%),radial-gradient(circle at 10% 90%,#fff3 0 12%,transparent 13%)}
.art{width:min(300px,78vw);aspect-ratio:1;background:#fff;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 8px #fff8,0 8px 20px #0003;animation:float 3s ease-in-out infinite}
.art img{width:92%}@keyframes float{50%{transform:translateY(-12px)}}
.hero h1{font-size:clamp(36px,9vw,60px);margin:0;text-shadow:0 4px 0 #0003;text-transform:capitalize;line-height:1}
.hero .itype{font-size:17px;padding:2px 16px;border:2px solid #fff}
.sec{background:#fff;border-radius:28px;padding:16px 18px 18px;margin-top:18px;box-shadow:0 6px 0 #0002}
.sec h2{margin:0 0 10px;font-size:26px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fact{background:#eef3ff;border-radius:18px;padding:8px 14px;font-weight:600}.fact small{display:block;color:#667;font-weight:800}
.st{display:grid;grid-template-columns:72px 40px 1fr;gap:8px;align-items:center;font-weight:700;margin:5px 0}
.tr{background:#eef;border-radius:99px;overflow:hidden}.tr i{display:block;height:16px;border-radius:99px;background:var(--b);width:var(--w);animation:grow 1s}
@keyframes grow{from{width:0}}
.evo{display:flex;flex-direction:column;gap:14px;overflow-x:auto;padding-bottom:6px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.split{display:flex;flex-direction:column;gap:10px}
.arrow{text-align:center;font-size:28px;font-weight:800;color:#e63946;min-width:76px;line-height:1}.arrow small{display:block;font-size:13px;color:#556;margin-top:2px}
.evc{background:#f3f6ff;border:4px solid transparent;border-radius:22px;padding:8px;text-align:center;width:132px;transition:.2s}
.evc:hover{transform:scale(1.07);border-color:#ffd93d}.evc.cur{border-color:#e63946;background:#fff1f1}
.evc img{width:96px;height:96px;object-fit:contain}.evc b{display:block;line-height:1}.evc small{color:#889;display:block;font-weight:700}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gal figure{margin:0;text-align:center;background:#fff;border:3px solid #eef3ff;border-radius:20px;padding:8px}
.gal img{width:100%;height:150px;object-fit:contain}.gal figcaption{font-weight:800;font-size:14px;text-transform:capitalize}
.dx{display:flex;gap:10px;margin:9px 0;align-items:flex-start;flex-wrap:wrap}
.dx b{background:#ffd93d;border-radius:14px;padding:1px 10px;font-size:14px;max-width:100%}
.dx p{margin:0;flex:1 1 260px;line-height:1.35;font-weight:500}
summary{cursor:pointer;font-weight:800;color:#e63946;margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:8px;margin:18px 0 8px;flex-wrap:wrap}
.ld{text-align:center;padding:60px 20px;font-weight:800;font-size:22px}.ld .ball{font-size:72px;display:block;margin:0 auto 14px}
footer{text-align:center;padding:20px;font-size:13px;color:#334}
.mv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.mc{border-radius:18px;border:3px solid var(--c);background:#fff;overflow:hidden}
.mc>div{display:flex;align-items:center;gap:6px;background:var(--c);color:#fff;padding:5px 10px;text-shadow:0 1px 2px #0006}.mc b{font-size:17px;flex:1;line-height:1.1}
.mc ul{display:flex;gap:4px;list-style:none;margin:0;padding:7px 10px 0;font-weight:800;font-size:13px;flex-wrap:wrap}.mc li{background:#eef3ff;border-radius:10px;padding:0 8px}
.mc p{margin:0;padding:5px 10px 9px;font-size:14px;line-height:1.3;font-weight:500}
details.mg>summary{font-size:19px;color:#2b2d42;background:#eef3ff;border-radius:16px;padding:6px 14px;margin-top:10px}
body{top:0!important;position:static!important}.goog-te-banner-frame,.VIpgJd-ZVi9od-ORHb-OEVmcd,#goog-gt-tt,.VIpgJd-yAWNEb-L7lbkb{display:none!important}.goog-text-highlight{background:none!important;box-shadow:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><a href="#" class="logo"><span class="ball"></span>Pokédex Explorer<span class="ball"></span></a>
<div class="bar"><input id="q" placeholder="🔍 Search by name or number…" autocomplete="off"><button class="btn" id="rnd">🎲 Random!</button><button class="btn" id="tr" translate="no">🌐 Translate to Indonesian</button></div></header>
<main id="v"></main>
<footer>Data &amp; images load live from <a href="https://pokemondb.net" target="_blank" rel="noopener"><u>pokemondb.net</u></a> every time a page opens · Pokémon © Nintendo / Game Freak</footer>
<script>
const U='https://pokemondb.net',$=s=>document.querySelector(s),V=$('#v');
const T={normal:'#a8a77a',fire:'#ee8130',water:'#6390f0',electric:'#e9b800',grass:'#5fb336',ice:'#6cc5c1',fighting:'#c22e28',poison:'#a33ea1',ground:'#c9a43e',flying:'#8d73ee',psychic:'#f95587',bug:'#a6b91a',rock:'#b6a136',ghost:'#735797',dragon:'#6f35fc',dark:'#705746',steel:'#8e8ea8',fairy:'#d685ad'};
document.head.insertAdjacentHTML('beforeend','<style>'+Object.entries(T).map(([k,v])=>`.itype.${k}{background:${v}}`).join('')+'</style>');
const I={Species:'🔎',Height:'📏',Weight:'⚖️',Abilities:'✨'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
sl=h=>(h||'').split('/').pop().replace(/[^a-z0-9-]/gi,'').toLowerCase(),
home=(s,k='normal')=>`https://img.pokemondb.net/sprites/home/${k}/${s}.png`,
badge=t=>`<span class="itype ${t}">${t}</span>`,
img=s=>`<img loading="lazy" referrerpolicy="no-referrer" alt="${s}" src="${home(s)}" onerror="this.onerror=null;this.src='https://img.pokemondb.net/sprites/scarlet-violet/normal/${s}.png'">`,
fig=(l,u)=>`<figure><img loading="lazy" referrerpolicy="no-referrer" src="${u}" alt="${esc(l)}" onerror="this.closest('figure').remove()"><figcaption>${esc(l)}</figcaption></figure>`;
// pokemondb.net blocks direct browser access (CORS), so public proxies are tried. Nothing is stored.
const PX=[...['https://api.allorigins.win/raw?url=','https://corsproxy.io/?url=','https://api.codetabs.com/v1/proxy?quest='].map(p=>u=>p+encodeURIComponent(u))];
async function get(u){for(const p of PX){try{const c=new AbortController,t=setTimeout(()=>c.abort(),15000),r=await fetch(p(u),{signal:c.signal});clearTimeout(t);if(!r.ok)continue;const h=await r.text();if(h.length>3000&&/pokemondb/i.test(h))return new DOMParser().parseFromString(h,'text/html')}catch(e){}}throw 0}
const load=t=>V.innerHTML=`<div class="ld"><span class="ball spin"></span>${t}</div>`,
fail=f=>{V.innerHTML=`<div class="ld">😵 Could not load data from pokemondb.net.<br><small>Check your internet connection and try again.</small><br><br><button class="btn" id="rt">🔄 Try again</button></div>`;$('#rt').onclick=f};
let all=[],q='',ty='',gn='',ls=0,listP;
function loadList(){return listP=get(U+'/pokedex/national').then(d=>{let g='';all=[];d.querySelectorAll('h2,.infocard').forEach(n=>{if(n.matches('h2')){const m=n.textContent.match(/Generation\s*(\d+)/i);if(m)g=m[1];return}const a=n.querySelector('a.ent-name');if(!a)return;all.push({s:sl(a.getAttribute('href')),n:a.textContent.trim(),no:n.querySelector('small')?.textContent.trim()||'',t:[...n.querySelectorAll('.itype')].map(x=>x.textContent.trim().toLowerCase()),g})});if(!all.length)throw 0})}
function draw(){const s=q.trim().toLowerCase(),r=all.filter(p=>(!s||p.n.toLowerCase().includes(s)||p.no.includes(s.replace('#','')))&&(!ty||p.t.includes(ty))&&(!gn||p.g===gn));
$('#ct').textContent=`✨ ${r.length} Pokémon found`;
$('#gr').innerHTML=r.map(p=>`<a class="card" href="#/${p.s}" style="--c:${T[p.t[0]]||'#888'}"><small>${esc(p.no)}</small>${img(p.s)}<b translate="no">${esc(p.n)}</b>${p.t.map(badge).join('')}</a>`).join('')||'<p class="count">No matches 🙈</p>'}
function list(){const gs=[...new Set(all.map(p=>p.g))].filter(Boolean);
V.innerHTML=`<div class="chips"><select class="btn" id="gs" style="font-size:16px;padding:1px 12px"><option value="">🌍 All generations</option>${gs.map(g=>`<option value="${g}"${g==gn?' selected':''}>Generation ${g}</option>`).join('')}</select></div>
<div class="chips" id="ch"><button class="chip${ty?'':' on'}" data-t="" style="--c:#556">All</button>${Object.keys(T).map(k=>`<button class="chip${ty==k?' on':''}" data-t="${k}" style="--c:${T[k]}">${k}</button>`).join('')}</div><div class="count" id="ct"></div><div class="grid" id="gr"></div>`;
$('#gs').onchange=e=>{gn=e.target.value;draw()};
$('#ch').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;ty=b.dataset.t;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));draw()};
draw();scrollTo(0,ls)}
const CI={Physical:'💥',Special:'🔮',Status:'🌀'};let MV,mvP;
const hx=t=>{const h=[...(t.tHead||t).querySelectorAll('th')].map(x=>x.textContent.trim().toLowerCase()),f=k=>h.findIndex(x=>x.startsWith(k));return{n:Math.max(f('move'),f('name')),t:f('type'),c:f('cat'),p:f('power'),a:f('acc'),pp:f('pp'),e:f('effect')}};
const nt=el=>{let n=el.nextElementSibling;while(n&&!/^H[23]$/.test(n.tagName)&&!n.matches('table')&&!n.querySelector('table'))n=n.nextElementSibling;return n&&(n.matches('table')?n:n.querySelector('table'))};
// Move descriptions (effect text) come from pokemondb's full move list, loaded once per visit.
const loadMoves=()=>mvP=get(U+'/move/all').then(d=>{const t=[...d.querySelectorAll('table')].find(t=>[...t.querySelectorAll('th')].some(h=>/^effect/i.test(h.textContent.trim())));if(!t)throw 0;const x=hx(t);MV=new Map();t.querySelectorAll('tbody tr').forEach(r=>{const c=r.children,n=c[x.n]?.textContent.trim().toLowerCase();if(n)MV.set(n,{e:c[x.e]?.textContent.trim(),pp:c[x.pp]?.textContent.trim()})})}).catch(e=>{mvP=null;throw e});
const mcard=m=>{const f=MV?.get(m.nm.toLowerCase()),c=T[m.t]||'#888',tg=/^\d+$/.test(m.tag)?'Lv. '+m.tag:m.tag;return `<div class="mc" style="--c:${c}"><div><b translate="no">${esc(m.nm)}</b><span class="itype ${m.t.replace(/[^a-z]/g,'')}" style="border:2px solid #fff">${esc(m.t)}</span></div><ul>${tg?`<li>${esc(tg)}</li>`:''}<li>${CI[m.c]||''} ${esc(m.c||'—')}</li><li>💪 Power ${esc(m.p||'—')}</li><li>🎯 Acc. ${esc(m.a||'—')}</li><li>PP ${esc(f?.pp||'—')}</li></ul><p>${f?.e?esc(f.e):'No description available.'}</p></div>`};
async function detail(s){
if($('#gr'))ls=scrollY;
load('Catching '+s+'…');
let d;try{d=await get(`${U}/pokedex/${s}`)}catch(e){return fail(()=>detail(s))}
if(sl(location.hash.slice(2))!==s)return;
const tb=[...d.querySelectorAll('table.vitals-table')],vt=tb.find(t=>/National/.test(t.querySelector('th')?.textContent)),F=[];let types=[],no='';
vt?.querySelectorAll('tr').forEach(r=>{const th=r.querySelector('th'),td=r.querySelector('td');if(!th||!td)return;const k=th.textContent.trim();
if(k=='Type'){types=[...td.querySelectorAll('.itype')].map(x=>x.textContent.trim().toLowerCase());return}
const c=td.cloneNode(true);c.querySelectorAll('br').forEach(b=>b.replaceWith(' • '));const v=c.textContent.replace(/\s+/g,' ').trim();
if(/^National/.test(k))no=v;else if(!/^Local/.test(k))F.push([k,v])});
const nm=d.querySelector('h1')?.textContent.trim()||s,c=T[types[0]]||'#e63946';document.title=nm+' • Pokédex Explorer';
const S=[];tb.find(t=>t.querySelector('th')?.textContent.trim()=='HP')?.querySelectorAll('tr').forEach(r=>{const l=r.querySelector('th')?.textContent.trim(),v=+r.querySelector('td.cell-num')?.textContent;if(l&&v)S.push([l,v])});
const D=[],h=[...d.querySelectorAll('h2')].find(x=>/Pok.dex entries/i.test(x.textContent));
if(h){let n=h.nextElementSibling;while(n&&!n.matches('h2')&&!n.matches('table')&&!n.querySelector('table'))n=n.nextElementSibling;
const t=n&&(n.matches('table')?n:n.querySelector('table'));
t?.querySelectorAll('tr').forEach(r=>{const th=r.querySelector('th'),td=r.querySelector('td');if(th&&td)D.push([[...th.querySelectorAll('span')].map(x=>x.textContent.trim()).filter(Boolean).join(' / ')||th.textContent.trim(),td.textContent.trim()])})}
const pc=n=>{const a=n.querySelector('a.ent-name');if(!a)return'';const x=sl(a.getAttribute('href'));return `<a class="evc${x==s?' cur':''}" href="#/${x}">${img(x)}<b translate="no">${esc(a.textContent)}</b><small>${esc(n.querySelector('small')?.textContent||'')}</small>${[...n.querySelectorAll('.itype')].map(t=>badge(t.textContent.trim().toLowerCase().replace(/[^a-z]/g,''))).join('')}</a>`};
const evo=n=>n.matches('.infocard')?pc(n):n.matches('.infocard-arrow')?`<div class="arrow">➜<small>${esc(n.textContent.trim())}</small></div>`:n.matches('.infocard-evo-split')?`<div class="split">${[...n.children].map(x=>`<div class="row">${evo(x)}</div>`).join('')}</div>`:[...n.children].map(evo).join('');
const ev=[...d.querySelectorAll('.infocard-list-evo')].filter(e=>!e.parentElement.closest('.infocard-list-evo')).map(e=>`<div class="row">${evo(e)}</div>`).join('');
const G=new Map([[s,['Artwork',`https://img.pokemondb.net/artwork/large/${s}.jpg`]]]);
d.querySelectorAll('img[src*="/artwork/"]').forEach(i=>{const f=sl(i.getAttribute('src').replace(/\.\w+$/,''));if(f)G.set(f,[i.alt||f.replace(/-/g,' '),`https://img.pokemondb.net/artwork/large/${f}.jpg`])});
const M=[],mh=[...d.querySelectorAll('h2')].find(x=>/Moves learn/i.test(x.textContent));let game='';
if(mh){let n=mh.nextElementSibling;while(n&&n.tagName!='H2'&&!n.querySelector('h3'))n=n.nextElementSibling;
if(n&&n.tagName!='H2'){game=n.querySelector('.sv-tabs-tab-list a')?.textContent.trim()||'';
(n.querySelector('.sv-tabs-panel')||n).querySelectorAll('h3').forEach(h3=>{const t=nt(h3);if(!t)return;const x=hx(t),rows=[];t.querySelectorAll('tbody tr').forEach(r=>{const c=r.children,g=i=>i<0?'':(c[i]?.textContent.trim()||''),nm=g(x.n);if(nm)rows.push({tag:x.n>0?g(0):'',nm,t:g(x.t).toLowerCase(),c:c[x.c]?.querySelector('img')?.alt||g(x.c),p:g(x.p),a:g(x.a)})});if(rows.length)M.push([h3.textContent.trim(),rows])})}}
const mvSec=M.length?`<div class="sec"><h2>⚔️ Moves${game?` <small translate="no">(${esc(game)})</small>`:''}</h2><div id="mv" data-s="${s}">⏳ Loading moves and descriptions…</div></div>`:'<div class="sec"><h2>⚔️ Moves</h2>Could not read the move list for this Pokémon.</div>';
const dx=a=>a.map(([g,t])=>`<div class="dx"><b>${esc(g)}</b><p>${esc(t)}</p></div>`).join('');
V.innerHTML=`<div class="wrap"><a class="btn" href="#">⬅ All Pokémon</a>
<section class="hero" style="--c:${c}"><div class="art"><img referrerpolicy="no-referrer" src="${G.get(s)[1]}" alt="${esc(nm)}" onerror="this.onerror=null;this.src='${home(s)}'"></div>
<div><div style="font-weight:800;font-size:24px">${no?'#'+esc(no.replace('#','')):''}</div><h1 translate="no">${esc(nm)}</h1><div>${types.map(badge).join('')}</div></div></section>
<div class="sec"><h2>📋 About ${esc(nm)}</h2><div class="facts">${F.map(([k,v])=>`<div class="fact"><small>${I[k]||'🔹'} ${esc(k)}</small>${esc(v)}</div>`).join('')||'No data available.'}</div></div>
${S.length?`<div class="sec"><h2>💪 Base Stats</h2>${S.map(([l,v])=>`<div class="st"><span>${esc(l)}</span><span>${v}</span><div class="tr">${l=='Total'?'':`<i style="--w:${Math.min(100,v/1.8)}%;--b:hsl(${Math.min(v,150)*.8},85%,48%)"></i>`}</div></div>`).join('')}</div>`:''}
<div class="sec"><h2>🧬 Evolution chain (all the way to the final form)</h2>${ev?`<div class="evo">${ev}</div>`:`<p>${esc(nm)} does not evolve 🌟</p>`}</div>
<div class="sec"><h2>🖼️ Image gallery</h2><div class="gal">${[...G.values()].map(([l,u])=>fig(l,u)).join('')}${fig('Normal',home(s))}${fig('Shiny ✨',home(s,'shiny'))}</div></div>
${D.length?`<div class="sec"><h2>📖 Pokédex entries</h2>${dx(D.slice(0,6))}${D.length>6?`<details><summary>Show ${D.length-6} more entries from other games</summary>${dx(D.slice(6))}</details>`:''}</div>`:''}
${mvSec}<div class="nav" id="nav"></div><p style="text-align:center"><a class="btn" target="_blank" rel="noopener" href="${U}/pokedex/${s}">🔗 Open on pokemondb.net</a></p></div>`;
scrollTo(0,0);
